<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مولّد التوثيق الأكاديمي MLA 9</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    direction: rtl;
}
.container {
    max-width: 1100px;
    margin: 40px auto;
    background: #fff;
    padding: 35px;
    border-radius: 12px;
}
h1 {
    text-align: center;
    color: #003366;
}
label {
    font-weight: bold;
    margin-top: 15px;
    display: block;
}
input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
}
button {
    margin-top: 25px;
    padding: 14px;
    background: #003366;
    color: #fff;
    border: none;
    width: 100%;
    font-size: 16px;
}
.output {
    background: #eef1f5;
    padding: 15px;
    margin-top: 10px;
    border-radius: 8px;
    direction: ltr;
}
small { color:#555; }
</style>
</head>

<body>
<div class="container">

<h1>مولّد التوثيق الأكاديمي – MLA الإصدار التاسع</h1>

<label>نوع المرجع</label>
<select id="sourceType" onchange="toggleEdition()">
    <option value="book">كتاب</option>
    <option value="chapter">فصل من كتاب</option>
    <option value="article">مقال</option>
    <option value="website">صفحة ويب</option>
    <option value="blog">مدونة</option>
</select>

<label>نوع الاستخدام</label>
<select id="citationType">
    <option value="paraphrase">إعادة صياغة</option>
    <option value="quote">اقتباس مباشر</option>
</select>

<label>هل المؤلف معروف؟</label>
<select id="authorKnown" onchange="toggleAuthors()">
    <option value="yes">نعم</option>
    <option value="no">لا</option>
</select>

<div id="authorsSection">
<label>عدد المؤلفين</label>
<select id="authorsCount" onchange="buildAuthors()">
    <option value="1">مؤلف واحد</option>
    <option value="2">مؤلفان</option>
    <option value="3">ثلاثة مؤلفين أو أكثر</option>
</select>

<div id="authors"></div>
</div>

<label>عنوان الصفحة / الفصل / المقال</label>
<input id="chapter">

<label>عنوان المصدر الرئيسي</label>
<input id="title">

<div id="editionField">
<label>الطبعة (إن لم تكن الأولى)</label>
<input id="edition">
</div>

<label>الناشر / الموقع</label>
<input id="publisher">

<label>سنة النشر</label>
<input id="year">

<label>رقم الصفحة</label>
<input id="page">

<label>الرابط (URL)</label>
<input id="url">

<button onclick="generate()">توليد التوثيق</button>

<h3>التوثيق داخل النص</h3>
<div id="intext" class="output"></div>

<h3>قائمة المراجع</h3>
<div id="works" class="output"></div>

</div>

<script>
function toggleEdition(){
    let t=document.getElementById("sourceType").value;
    document.getElementById("editionField").style.display =
        (t==="book"||t==="chapter")?"block":"none";
}
function toggleAuthors(){
    document.getElementById("authorsSection").style.display =
        document.getElementById("authorKnown").value==="yes"?"block":"none";
}
function buildAuthors(){
    let c=document.getElementById("authorsCount").value;
    let d=document.getElementById("authors");
    d.innerHTML="";
    let n=(c==="3")?1:c;
    for(let i=1;i<=n;i++){
        d.innerHTML+=`
        <label>اسم العائلة للمؤلف ${i}</label>
        <input class="ln">
        <label>الاسم الأول للمؤلف ${i}</label>
        <input class="fn">`;
    }
}
toggleEdition(); toggleAuthors(); buildAuthors();

function generate(){
    let citationType=document.getElementById("citationType").value;
    let authorKnown=document.getElementById("authorKnown").value;
    let count=document.getElementById("authorsCount").value;
    let ln=document.querySelector(".ln")?.value||"";
    let fn=document.querySelector(".fn")?.value||"";
    let page=document.getElementById("page").value;
    let chapter=document.getElementById("chapter").value;
    let title=document.getElementById("title").value;
    let publisher=document.getElementById("publisher").value;
    let year=document.getElementById("year").value;
    let edition=document.getElementById("edition").value;
    let url=document.getElementById("url").value;

    if(citationType==="quote" && !page){
        alert("رقم الصفحة إلزامي في الاقتباس المباشر.");
        return;
    }

    let inTextAuthor="";
    let worksAuthor="";

    if(authorKnown==="yes"){
        if(count==="1"){
            inTextAuthor=ln;
            worksAuthor=`${ln}، ${fn}.`;
        }
        else if(count==="2"){
            inTextAuthor=`${ln} و${document.querySelectorAll(".ln")[1].value}`;
            worksAuthor=`${ln}، ${fn}، و ${document.querySelectorAll(".fn")[1].value} ${document.querySelectorAll(".ln")[1].value}.`;
        }
        else{
            inTextAuthor=`${ln} وآخرون`;
            worksAuthor=`${ln}، ${fn}، وآخرون.`;
        }
    } else {
        inTextAuthor=`"${chapter}"`;
    }

    document.getElementById("intext").textContent =
        citationType==="quote" ? `(${inTextAuthor} ${page})`
        : page ? `(${inTextAuthor} ${page})` : `(${inTextAuthor})`;

    document.getElementById("works").innerHTML =
        `${worksAuthor} <em>${title}</em>. ${edition?edition+", ":""}${publisher}، ${year}. ${url}`;
}
</script>

</body>
</html>
