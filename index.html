<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مولّد توثيق MLA 9</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}
.container {
    max-width: 950px;
    margin: 40px auto;
    background: #fff;
    padding: 35px;
    border-radius: 12px;
}
h1 {
    text-align: center;
    color: #004085;
}
label {
    font-weight: bold;
    margin-top: 15px;
    display: block;
}
input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
}
button {
    margin-top: 20px;
    padding: 12px;
    background: #004085;
    color: #fff;
    border: none;
    width: 100%;
    font-size: 16px;
}
.output {
    background: #eef1f5;
    padding: 15px;
    margin-top: 10px;
    border-radius: 8px;
}
</style>
</head>

<body>
<div class="container">

<h1>مولّد التوثيق MLA 9</h1>

<label>نوع المرجع</label>
<select id="type">
    <option value="book">كتاب</option>
    <option value="chapter">فصل من كتاب</option>
    <option value="ebook">كتاب إلكتروني</option>
    <option value="article">مقال / صحيفة</option>
    <option value="website">صفحة ويب</option>
    <option value="tweet">تغريدة</option>
    <option value="video">مادة سمعية/بصرية</option>
</select>

<label>اسم العائلة للمؤلف الأول</label>
<input id="lastName">

<label>الاسم الأول للمؤلف الأول</label>
<input id="firstName">

<label>عدد المؤلفين</label>
<select id="authorsCount">
    <option value="1">مؤلف واحد</option>
    <option value="2">مؤلفان</option>
    <option value="3">ثلاثة فأكثر</option>
</select>

<label>عنوان المصدر</label>
<input id="title">

<label>عنوان الفصل / المقال (إن وجد)</label>
<input id="chapter">

<label>الناشر / الموقع</label>
<input id="publisher">

<label>السنة</label>
<input id="year">

<label>رقم الصفحة (للاقتباس داخل النص)</label>
<input id="page">

<label>الرابط (إن وجد)</label>
<input id="url">

<button onclick="generate()">توليد التوثيق</button>

<h3>التوثيق داخل النص</h3>
<div id="intext" class="output"></div>

<h3>قائمة المراجع</h3>
<div id="works" class="output"></div>

</div>

<script>
function generate() {
    let type = document.getElementById("type").value;
    let ln = document.getElementById("lastName").value || "غير معروف";
    let fn = document.getElementById("firstName").value;
    let count = document.getElementById("authorsCount").value;
    let title = document.getElementById("title").value;
    let chapter = document.getElementById("chapter").value;
    let pub = document.getElementById("publisher").value;
    let year = document.getElementById("year").value;
    let page = document.getElementById("page").value;
    let url = document.getElementById("url").value;

    /* ===== In-text ===== */
    let inText = "";
    if (count === "3") {
        inText = page ? `(${ln} وآخرون ${page})` : `(${ln} وآخرون)`;
    } else {
        inText = page ? `(${ln} ${page})` : `(${ln})`;
    }

    document.getElementById("intext").textContent = inText;

    /* ===== Works Cited ===== */
    let authorWC = "";
    if (count === "3") {
        authorWC = `${ln}، ${fn}، وآخرون.`;
    } else {
        authorWC = `${ln}، ${fn}.`;
    }

    let works = "";

    switch(type) {
        case "book":
            works = `${authorWC} <em>${title}</em>. ${pub}، ${year}.`;
            break;

        case "chapter":
            works = `${authorWC} "${chapter}." <em>${title}</em>. ${pub}، ${year}.`;
            break;

        case "ebook":
            works = `${authorWC} <em>${title}</em>. ${year}. ${url}.`;
            break;

        case "article":
            works = `${authorWC} "${chapter}." <em>${title}</em>، ${year}.`;
            break;

        case "website":
            works = `${authorWC} "${chapter}." <em>${title}</em>، ${year}، ${url}.`;
            break;

        case "tweet":
            works = `${authorWC} "${chapter}." تويتر، ${year}، ${url}.`;
            break;

        case "video":
            works = `<em>${title}</em>. إخراج ${fn} ${ln}، ${pub}، ${year}.`;
            break;
    }

    document.getElementById("works").innerHTML = works;
}
</script>

</body>
</html>
