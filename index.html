<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مولّد التوثيق الأكاديمي MLA 9</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    direction: rtl;
}
.container {
    max-width: 1100px;
    margin: 40px auto;
    background: #fff;
    padding: 35px;
    border-radius: 12px;
}
h1 {
    text-align: center;
    color: #003366;
}
label {
    font-weight: bold;
    margin-top: 15px;
    display: block;
}
input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
}
button {
    margin-top: 25px;
    padding: 14px;
    background: #003366;
    color: #fff;
    border: none;
    width: 100%;
    font-size: 16px;
}
.output {
    background: #eef1f5;
    padding: 15px;
    margin-top: 10px;
    border-radius: 8px;
    direction: ltr;
}
small { color:#555; }
</style>
</head>

<body>
<div class="container">

<h1>مولّد التوثيق الأكاديمي – MLA الإصدار التاسع</h1>

<!-- ================= نوع المرجع ================= -->
<label>نوع المرجع</label>
<select id="sourceType" onchange="toggleFields()">
    <option value="book">كتاب</option>
    <option value="chapter">فصل من كتاب</option>
    <option value="article">مقال / مجلة</option>
    <option value="website">صفحة ويب</option>
    <option value="blog">تدوينة (Blog)</option>
    <option value="video">مادة مرئية / فيديو</option>
</select>

<!-- ================= نوع الاستخدام ================= -->
<label>نوع الاستخدام</label>
<select id="citationType">
    <option value="paraphrase">إعادة صياغة (اقتباس غير مباشر)</option>
    <option value="quote">اقتباس مباشر</option>
</select>

<!-- ================= المؤلف ================= -->
<label>هل المؤلف معروف؟</label>
<select id="authorKnown" onchange="toggleAuthor()">
    <option value="yes">نعم</option>
    <option value="no">لا</option>
</select>

<div id="authorsSection">
<label>عدد المؤلفين</label>
<select id="authorsCount" onchange="buildAuthors()">
    <option value="1">مؤلف واحد</option>
    <option value="2">مؤلفان</option>
    <option value="3">ثلاثة مؤلفين أو أكثر</option>
</select>

<div id="authors"></div>
</div>

<!-- ================= العناوين ================= -->
<label>عنوان الصفحة / الفصل / المقال</label>
<input id="chapter">

<label>عنوان المصدر الرئيسي <small>(الكتاب / الموقع / المجلة)</small></label>
<input id="title">

<div id="editionField">
<label>الطبعة <small>(إن لم تكن الأولى)</small></label>
<input id="edition" placeholder="مثال: 2nd ed.">
</div>

<label>الناشر / راعي الموقع</label>
<input id="publisher">

<label>سنة أو تاريخ النشر</label>
<input id="year">

<label>رقم الصفحة <small>(إلزامي للاقتباس المباشر)</small></label>
<input id="page">

<label>الرابط (URL)</label>
<input id="url">

<button onclick="generate()">توليد التوثيق</button>

<h3>التوثيق داخل النص (In-text citation)</h3>
<div id="intext" class="output"></div>

<h3>قائمة المراجع (Works Cited)</h3>
<div id="works" class="output"></div>

</div>

<script>
function toggleFields(){
    let type = document.getElementById("sourceType").value;
    document.getElementById("editionField").style.display =
        (type === "book" || type === "chapter") ? "block" : "none";
}

function toggleAuthor(){
    let known = document.getElementById("authorKnown").value;
    document.getElementById("authorsSection").style.display =
        known === "yes" ? "block" : "none";
}

function buildAuthors(){
    let count = document.getElementById("authorsCount").value;
    let div = document.getElementById("authors");
    div.innerHTML = "";
    let n = count === "3" ? 1 : count;

    for(let i=1;i<=n;i++){
        div.innerHTML += `
        <label>اسم عائلة المؤلف ${i}</label>
        <input class="ln">
        <label>الاسم الأول للمؤلف ${i}</label>
        <input class="fn">
        `;
    }
}
toggleFields(); toggleAuthor(); buildAuthors();

function generate(){
    let sourceType = document.getElementById("sourceType").value;
    let citationType = document.getElementById("citationType").value;
    let authorKnown = document.getElementById("authorKnown").value;
    let chapter = document.getElementById("chapter").value;
    let title = document.getElementById("title").value;
    let edition = document.getElementById("edition").value;
    let pub = document.getElementById("publisher").value;
    let year = document.getElementById("year").value;
    let page = document.getElementById("page").value;
    let url = document.getElementById("url").value;

    let ln = document.querySelector(".ln")?.value || "";
    let fn = document.querySelector(".fn")?.value || "";

    if(citationType==="quote" && !page){
        alert("يجب إدخال رقم الصفحة عند الاقتباس المباشر.");
        return;
    }

    let inTextAuthor = authorKnown==="yes" ? `${ln} وآخرون` : `"${chapter}"`;

    document.getElementById("intext").textContent =
        citationType==="quote" ? `(${inTextAuthor} ${page})`
        : page ? `(${inTextAuthor} ${page})` : `(${inTextAuthor})`;

    let works="";
    if(sourceType==="book"){
        works = `${ln}، ${fn}، وآخرون. <em>${title}</em>. ${edition?edition+", ":""}${pub}، ${year}.`;
    } else if(sourceType==="website" && authorKnown==="no"){
        works = `"${chapter}." <em>${title}</em>، ${pub}، ${year}، ${url}.`;
    } else {
        works = `${ln}، ${fn}. "${chapter}." <em>${title}</em>، ${year}، ${url}.`;
    }

    document.getElementById("works").innerHTML = works;
}
</script>

</body>
</html>
