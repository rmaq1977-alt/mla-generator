<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مولّد توثيق MLA 9</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #f0f4f8, #d9e2ec);
}
.container {
    max-width: 900px;
    margin: 40px auto;
    background: #fff;
    padding: 40px;
    border-radius: 15px;
}
label { font-weight: bold; margin-top: 15px; display: block; }
small { color: #555; display: block; }
input, select {
    width: 100%; padding: 10px; margin-top: 5px;
}
button {
    margin-top: 20px;
    padding: 12px;
    background: #007bff;
    color: white;
    border: none;
    cursor: pointer;
}
.output {
    background: #e9ecef;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    white-space: pre-wrap;
}
</style>
</head>

<body>
<div class="container">

<h2>مولّد توثيق MLA 9</h2>

<label>نوع المصدر</label>
<select id="sourceType">
<option value="book">كتاب</option>
<option value="chapter">فصل في كتاب</option>
<option value="article">مقال</option>
<option value="website">موقع إلكتروني</option>
<option value="thesis">رسالة / أطروحة</option>
<option value="video">فيديو / محاضرة</option>
<option value="tweet">تغريدة</option>
</select>

<label>عدد المؤلفين</label>
<select id="authorCount">
<option value="1">مؤلف واحد</option>
<option value="2">مؤلفان</option>
<option value="3">ثلاثة مؤلفين فأكثر</option>
</select>

<label>نوع الاقتباس</label>
<select id="quoteType">
<option value="directMention">اقتباس مباشر مع ذكر المؤلف</option>
<option value="directNoMention">اقتباس مباشر دون ذكر المؤلف</option>
<option value="indirect">اقتباس غير مباشر</option>
</select>

<label>أسماء المؤلفين</label>
<input type="text" id="author" placeholder="مثال: أحمد علي، محمد حسن، سارة يوسف">

<label>عنوان المصدر</label>
<input type="text" id="title">

<label>الناشر / الجهة</label>
<input type="text" id="publisher">

<label>السنة</label>
<input type="text" id="year">

<label>رقم الصفحة</label>
<input type="text" id="page">

<label>الرابط (إن وجد)</label>
<input type="text" id="url">

<button onclick="generateCitation()">توليد التوثيق</button>

<h3>In-text citation</h3>
<div id="inText" class="output"></div>

<h3>Works Cited</h3>
<div id="worksCited" class="output"></div>

</div>

<script>
function lastName(fullName) {
    return fullName.trim().split(" ").slice(-1)[0];
}

function generateCitation() {
    const authors = document.getElementById("author").value.split(",");
    const authorCount = document.getElementById("authorCount").value;
    const quoteType = document.getElementById("quoteType").value;
    const type = document.getElementById("sourceType").value;
    const title = document.getElementById("title").value;
    const publisher = document.getElementById("publisher").value;
    const year = document.getElementById("year").value;
    const page = document.getElementById("page").value;
    const url = document.getElementById("url").value;

    const firstAuthor = lastName(authors[0]);
    let inText = "";

    // -------- In-text citation (MLA-9) --------
    if (authorCount === "3") {
        if (quoteType === "directMention") {
            inText = `${firstAuthor} وآخرون "${title}" (${page}).`;
        } 
        else if (quoteType === "directNoMention") {
            inText = `"${title}" (${firstAuthor} وآخرون ${page}).`;
        } 
        else {
            inText = `(${firstAuthor} وآخرون ${page}).`;
        }
    } else if (authorCount === "2") {
        inText = `(${lastName(authors[0])} و${lastName(authors[1])} ${page})`;
    } else {
        inText = `(${firstAuthor} ${page})`;
    }

    document.getElementById("inText").textContent = inText;

    // -------- Works Cited (MLA-9) --------
    let wcAuthor = authorCount === "3"
        ? `${authors[0].trim()}، وآخرون`
        : authors.join("، ");

    let worksCited = "";

    switch(type) {
        case "book":
            worksCited = `${wcAuthor}. ${title}. ${publisher}, ${year}.`;
            break;
        case "chapter":
            worksCited = `${wcAuthor}. "${title}." ${publisher}, ${year}.`;
            break;
        case "article":
            worksCited = `${wcAuthor}. "${title}." ${publisher}, ${year}.`;
            break;
        case "website":
            worksCited = `${wcAuthor}. "${title}." ${publisher}, ${year}, ${url}.`;
            break;
        case "thesis":
            worksCited = `${wcAuthor}. "${title}." ${publisher}, ${year}.`;
            break;
        case "video":
            worksCited = `${wcAuthor}. "${title}." ${publisher}, ${year}, ${url}.`;
            break;
        case "tweet":
            worksCited = `${wcAuthor}. "${title}." ${year}, ${url}.`;
            break;
    }

    document.getElementById("worksCited").textContent = worksCited;
}
</script>

</body>
</html>
