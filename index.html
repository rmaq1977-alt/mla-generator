<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مولّد توثيق MLA 9</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 0;
}
.container {
    max-width: 900px;
    margin: 40px auto;
    background: #fff;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}
h1 { text-align: center; color: #007bff; }
label { font-weight: bold; margin-top: 15px; display: block; }
small { color: #555; display: block; }
input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
button {
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}
.output {
    background: #e9ecef;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
    min-height: 40px;
}
.flex {
    display: flex;
    gap: 10px;
}
</style>
</head>

<body>
<div class="container">

<h1>مولّد توثيق MLA 9</h1>

<label>نوع المصدر:</label>
<select id="sourceType">
    <option value="book">كتاب</option>
    <option value="article">مقال علمي</option>
    <option value="newspaper">صحيفة</option>
    <option value="website">موقع إلكتروني</option>
    <option value="video">فيديو / محاضرة</option>
</select>

<label>اسم العائلة للمؤلف الأول:</label>
<input type="text" id="lastName" placeholder="مثال: الحموي">

<label>الاسم الأول للمؤلف الأول:</label>
<input type="text" id="firstName" placeholder="مثال: أحمد">

<label>عدد المؤلفين:</label>
<select id="authorCount">
    <option value="1">مؤلف واحد</option>
    <option value="2">مؤلفان</option>
    <option value="3">3 مؤلفين فأكثر</option>
</select>

<label>عنوان المصدر:</label>
<input type="text" id="title">

<label>الناشر / المجلة:</label>
<input type="text" id="publisher">

<label>السنة:</label>
<input type="text" id="year">

<label>رقم الصفحة (إن وجد):</label>
<input type="text" id="page">

<button onclick="generateCitation()">توليد التوثيق</button>

<h3>In-text citation</h3>
<div class="output" id="inText"></div>

<h3>Works Cited</h3>
<div class="output" id="worksCited"></div>

</div>

<script>
function generateCitation() {

    const type = document.getElementById("sourceType").value;
    const last = document.getElementById("lastName").value.trim();
    const first = document.getElementById("firstName").value.trim();
    const count = document.getElementById("authorCount").value;
    const title = document.getElementById("title").value.trim();
    const publisher = document.getElementById("publisher").value.trim();
    const year = document.getElementById("year").value.trim();
    const page = document.getElementById("page").value.trim();

    // ===== In-text citation =====
    let inTextAuthor = last;
    if (count === "3") inTextAuthor += " وآخرون";
    let inText = page ? `(${inTextAuthor} ${page})` : `(${inTextAuthor})`;
    document.getElementById("inText").textContent = inText;

    // ===== Works Cited =====
    let authorWC = "";

    if (type === "newspaper") {
        authorWC = `${first} ${last}`;
    } else {
        authorWC = `${last}، ${first}`;
    }

    if (count === "3") {
        authorWC += "، وآخرون";
    }

    let wc = `${authorWC}. "${title}." ${publisher}, ${year}.`;
    document.getElementById("worksCited").textContent = wc;
}
</script>

</body>
</html>
